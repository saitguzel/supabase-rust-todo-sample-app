[package]
name = "todo-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Production-ready Todo API: Actix Web 4 + Supabase Postgres + JWT + RBAC + Audit"
license = "MIT"

[[bin]]
name = "todo-backend"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.4", features = ["macros"] }
actix-cors = "0.7"
actix-governor = "0.5"
actix-rt = "2.9"
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.2"
bcrypt = "0.15"
validator = { version = "0.16", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-actix-web = "0.7"
utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "4", features = ["actix-web"] }
thiserror = "1.0"
anyhow = "1.0"
tokio-cron-scheduler = "0.9"
csv = "1.3"
futures-util = "0.3"
base64 = "0.21"
async-trait = "0.1"

[dev-dependencies]
actix-web = { version = "4.4", features = ["macros"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
